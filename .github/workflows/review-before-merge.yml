name: Review Before Merge

on:
  pull_request:
    branches:
      - main
      - master
      - new-branch
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-checks:
    name: Static checks (no automatic code edits)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out proposed code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        continue-on-error: true

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json or npm-shrinkwrap.json found. Using npm install; commit a lockfile for reproducible builds."
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: TypeScript type check
        run: npm run typecheck --if-present

      - name: Unit/regression tests
        run: |
          if npm run | grep -qE '^[[:space:]]+test([[:space:]:]|$)'; then
            npm test -- --runInBand
          else
            echo "::warning::No test script found. Add regression tests for important business rules."
          fi
        continue-on-error: true

      - name: Build
        env:
          # CI-only placeholder. Never use this value in production.
          SESSION_SECRET: ci-only-placeholder-secret-change-me
          NODE_ENV: production
        run: npm run build

      - name: Review reminder
        if: always()
        run: |
          echo "Automated checks do not prove business logic is correct."
          echo "Review the Pull Request diff and test the affected Army Transport workflow."
          echo "This workflow does not edit or auto-correct application code."
