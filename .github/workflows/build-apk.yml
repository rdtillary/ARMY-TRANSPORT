name: Build Android APK

# MCTE Transport — Driver APK (background GPS)
# The APK is a thin shell that loads the live Render site. GPS runs in a native
# Android foreground service (@capgo/background-geolocation) which keeps
# uploading positions with the screen off, the app in the background, or the
# app swiped away. Website updates never need a new APK; only native changes do.
#
# Run: GitHub -> Actions -> "Build Android APK" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Live server URL (no trailing slash)"
        required: true
        default: "https://mctetransportsys.onrender.com"
  push:
    branches: [main, master, new-branch]

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}-cap8-bg
          restore-keys: npm-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate logo exists
        run: |
          if [ ! -f public/mcte-logo.png ]; then
            echo "::error::public/mcte-logo.png is MISSING from the repository."
            exit 1
          fi

      - name: Install npm packages
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-audit --no-fund --legacy-peer-deps \
            @capacitor/core@^8.5.0 \
            @capacitor/cli@^8.5.0 \
            @capacitor/android@^8.5.0 \
            @capacitor/geolocation@^8.2.2 \
            @capgo/background-geolocation@8.4.13 \
            sharp@^0.35.4

      - name: Resolve server URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ github.event.inputs.server_url }}"
          else
            URL="https://mctetransportsys.onrender.com"
          fi
          URL="${URL%/}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Building APK pointing to: $URL"

      - name: Write Capacitor config and web shell
        run: |
          mkdir -p capacitor-web scripts public/icons

          cat > capacitor-web/index.html << 'HTMLEOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#141b10">
          <title>MCTE Transport</title>
          <style>
            body{margin:0;height:100vh;background:#141b10;color:#eee8d0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;gap:18px}
            .s{width:56px;height:56px;border-radius:50%;border:3px solid #8b6f2e;border-top-color:transparent;animation:r 1s linear infinite}
            @keyframes r{to{transform:rotate(360deg)}}
            .t{font-size:13px;font-weight:700;letter-spacing:.2em;color:#d4c48a}
          </style></head>
          <body><div class="s"></div><div class="t">MCTE TRANSPORT</div><div style="font-size:11px;color:#6d6349">Connecting to command server…</div></body></html>
          HTMLEOF

          # Use ONE config file: remove the repo's .ts config so it cannot override this.
          rm -f capacitor.config.ts capacitor.config.json
          cat > capacitor.config.json << JSONEOF
          {
            "appId": "com.army.transport.cms",
            "appName": "MCTE Transport",
            "webDir": "capacitor-web",
            "server": {
              "url": "${{ steps.url.outputs.url }}",
              "androidScheme": "https",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false,
              "useLegacyBridge": true
            }
          }
          JSONEOF
          cat capacitor.config.json

      - name: Generate fresh Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Add Android permissions
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          for perm in \
            android.permission.INTERNET \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_LOCATION \
            android.permission.POST_NOTIFICATIONS \
            android.permission.WAKE_LOCK \
            android.permission.RECEIVE_BOOT_COMPLETED ; do
            if ! grep -q "\"$perm\"" "$M"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"$perm\" />\n</manifest>#" "$M"
            fi
          done
          echo "=== Final permissions ==="
          grep "uses-permission" "$M"

      - name: Write icon generator script
        run: |
          cat > scripts/gen-icons.mjs << 'EOF'
          import sharp from "sharp";
          import { mkdirSync, writeFileSync } from "fs";

          const LOGO = "public/mcte-logo.png";
          const BG = { r: 30, g: 42, b: 22, alpha: 1 }; // #1E2A16

          async function iconWithBg(size, ratio) {
            const logo = await sharp(LOGO).resize(Math.round(size * ratio), Math.round(size * ratio), { fit: "inside" }).png().toBuffer();
            return sharp({ create: { width: size, height: size, channels: 4, background: BG } })
              .composite([{ input: logo, gravity: "center" }]).png().toBuffer();
          }
          async function iconTransparent(size) {
            const logo = await sharp(LOGO).resize(Math.round(size * 0.66), Math.round(size * 0.66), { fit: "inside" }).png().toBuffer();
            return sharp({ create: { width: size, height: size, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([{ input: logo, gravity: "center" }]).png().toBuffer();
          }

          const valuesDir = "android/app/src/main/res/values";
          mkdirSync(valuesDir, { recursive: true });
          writeFileSync(`${valuesDir}/ic_launcher_background.xml`,
            '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E2A16</color>\n</resources>\n');

          const fgSizes = { mdpi: 108, hdpi: 162, xhdpi: 216, xxhdpi: 324, xxxhdpi: 432 };
          const legacySizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          const dir = (d) => `android/app/src/main/res/mipmap-${d}`;
          for (const [d, s] of Object.entries(fgSizes)) {
            mkdirSync(dir(d), { recursive: true });
            await sharp(await iconTransparent(s)).toFile(`${dir(d)}/ic_launcher_foreground.png`);
          }
          for (const [d, s] of Object.entries(legacySizes)) {
            const buf = await iconWithBg(s, 0.85);
            await sharp(buf).toFile(`${dir(d)}/ic_launcher.png`);
            await sharp(buf).toFile(`${dir(d)}/ic_launcher_round.png`);
          }
          console.log("App icons generated");
          EOF

      - name: Generate app icons
        run: node scripts/gen-icons.mjs

      - name: Sync Capacitor to Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "::error::APK not found"; exit 1; }
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCTE-Transport-Driver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
