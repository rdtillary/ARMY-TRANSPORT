name: Build Android APK

# Compiles MCTE-Transport-APK (app-debug.apk) on GitHub's servers.
# Run it from: Actions tab -> Build Android APK -> Run workflow -> enter live URL.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your live website URL, e.g. https://mctetransportsys.onrender.com"
        required: true
        default: "https://mctetransportsys.onrender.com"
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Prints exactly what was uploaded — invaluable if a later step fails.
      - name: Show uploaded project files
        run: |
          echo "===== FILE TREE (top 3 levels) ====="
          find . -maxdepth 3 -type f -not -path './.git/*' | sort
          echo "===== KEY FILES CHECK ====="
          for f in package.json package-lock.json capacitor.config.ts scripts/gen-icons.mjs public/mcte-logo.png; do
            if [ -f "$f" ]; then echo "PRESENT: $f"; else echo "MISSING: $f"; fi
          done

      # Works whether or not package-lock.json exists.
      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Point the app at the live server URL
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's#url: ""#url: "${{ github.event.inputs.server_url }}"#' capacitor.config.ts
          echo "App will load: ${{ github.event.inputs.server_url }}"
          grep 'url:' capacitor.config.ts

      # Rebuilds android/ from scratch if it is missing or incompletely uploaded.
      - name: Prepare native project
        run: |
          mkdir -p capacitor-web
          if [ ! -f capacitor-web/index.html ]; then
            printf '%s\n' '<!doctype html><html><head><title>MCTE Transport</title></head><body>Loading…</body></html>' > capacitor-web/index.html
          fi
          if [ ! -f android/gradlew ]; then
            echo "android project missing/incomplete — generating a fresh one"
            rm -rf android
            npx cap add android
          else
            echo "android project found"
          fi
          # Ensure GPS + network permissions exist (idempotent).
          if ! grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml; then
            echo "Injecting location permissions"
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          fi
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true

      # Non-blocking: if the logo/sharp is absent, the APK still builds with a default icon.
      - name: Generate app icons from logo
        run: |
          if [ -f public/mcte-logo.png ]; then
            node scripts/gen-icons.mjs || echo "::warning::Icon generation failed — continuing with default icon"
          else
            echo "::warning::public/mcte-logo.png not found in repo — continuing with default icon"
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCTE-Transport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
