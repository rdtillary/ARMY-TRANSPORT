<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2215" />
    <title>Offline — MCTE Transport</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(circle at 50% 30%, #222e18 0%, #141b10 70%);
        color: #eee8d0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        padding: 28px;
      }
      img { width: 120px; height: 120px; border-radius: 50%; }
      h1 { font-size: 20px; letter-spacing: 0.18em; margin: 18px 0 8px; }
      p { color: #a89a76; font-size: 14px; max-width: 320px; line-height: 1.5; }
      button {
        margin-top: 22px; background: linear-gradient(135deg, #8b6f2e, #bfa15a);
        color: #1a1508; border: 0; border-radius: 12px; padding: 13px 28px;
        font-weight: 800; letter-spacing: 0.1em; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="" />
    <h1>NO NETWORK LINK</h1>
    <p>The command server cannot be reached. Restore your data/Wi‑Fi connection and retry — GPS tracking resumes automatically when the link is back.</p>
    <button onclick="location.reload()">RETRY CONNECTION</button>
  </body>
</html>
